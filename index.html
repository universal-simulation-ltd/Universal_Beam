<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <title>Universal Beam — send text and files straight between your devices</title>
    <meta name="description" content="Universal Beam — pair two devices with a short code and send text, links and files straight from one to the other. Peer-to-peer and end-to-end encrypted: no account, no upload, and no server ever holds what you send. Free and open source." />
    <meta name="keywords" content="send text between devices, send files between devices, cross device clipboard, peer to peer file transfer, webrtc file transfer, share link to phone, airdrop alternative in the browser, no account file sharing, open source" />
    <meta name="author" content="UNI·SIM" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://opensource.unisim.co.uk/beam/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal Beam" />
    <meta property="og:url" content="https://opensource.unisim.co.uk/beam/" />
    <meta property="og:title" content="Universal Beam — send text and files straight between your devices" />
    <meta property="og:description" content="Pair two devices with a short code and beam text, links and files device-to-device. End-to-end encrypted, and no server ever holds what you send." />

    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal Beam",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://opensource.unisim.co.uk/beam/",
      "description": "Universal Beam — pair two devices with a short code and send text, links and files straight from one to the other. Peer-to-peer and end-to-end encrypted: no account, no upload, and no server ever holds what you send. Free and open source.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
